group = core
admin-port = 13000
admin-password = kanneladmin
smsbox-port = 13001
log-level = 0
dlr-storage = internal

# 1.4.5-12 panics on one group with both port and receive-port set ("deprecated"); a non-transceiver
# TX/RX pair against the same host needs two groups sharing an smsc-id instead.
group = smsc
smsc = smpp
smsc-id = node-notrx
host = node
port = 2775
smsc-username = kannel-notrx
smsc-password = kannelpw
system-type = "kannel-esme"
interface-version = "34"
enquire-link-interval = 5
max-pending-submits = 10
reconnect-delay = 1
wait-ack = 5

group = smsc
smsc = smpp
smsc-id = node-notrx
host = node
receive-port = 2775
smsc-username = kannel-notrx
smsc-password = kannelpw
system-type = "kannel-esme"
interface-version = "34"
enquire-link-interval = 5
max-pending-submits = 10
reconnect-delay = 1
wait-ack = 5

group = smsbox
bearerbox-host = kannel-notrx-bearerbox
sendsms-port = 13013
global-sender = 46700000000
http-request-retry = 3
http-queue-delay = 1

group = sendsms-user
username = tester
password = testerpw
max-messages = 10
concatenation = true

group = sms-service
keyword = default
get-url = "http://node:8080/mo/notrx?from=%p&to=%P&text=%a&coding=%c&udh=%u"
max-messages = 0
omit-empty = true
